<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMISTOCK - Gestion du Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .sidebar { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); }
        .nav-item { color: #94a3b8; transition: all 0.3s; }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-item.active { background: #2dd4bf; color: white; box-shadow: 0 10px 20px -5px rgba(45, 212, 191, 0.4); }
        .card { background: white; border-radius: 30px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04); }
        .status-badge { @apply px-4 py-1.5 rounded-full text-[11px] font-black uppercase tracking-widest; }
        .modal { transition: opacity 0.3s; }
        .modal.hidden { display: none; }
        
        /* Premium Tooltip */
        [data-tooltip] { position: relative; }
        [data-tooltip]:before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 12px;
            background: #1e293b;
            color: white;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 10px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 100;
        }
        [data-tooltip]:hover:before {
            opacity: 1;
            visibility: visible;
            bottom: 140%;
        }
        [data-tooltip]:after {
            content: '';
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #1e293b transparent transparent transparent;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        [data-tooltip]:hover:after {
            opacity: 1;
            visibility: visible;
            bottom: 125%;
        }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="sidebar w-72 flex flex-col p-8 text-white fixed h-full z-50">
        <div class="mb-12 flex items-center gap-3">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
            <h2 class="text-xl font-bold tracking-tight uppercase" id="company_name_sidebar">OMISTOCK</h2>
        </div>

        <nav class="space-y-3 flex-1">
            <a href="dashboard.html" class="nav-item flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="inventory.html" class="nav-item active flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                <span class="font-medium">Stock</span>
            </a>
            <a href="sales.html" class="nav-item flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="font-medium">Commandes</span>
            </a>
            <a href="reports.html" class="nav-item flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="font-medium">Rapports</span>
            </a>
            <a href="suppliers.html" class="nav-item flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span class="font-medium">Fournisseurs</span>
            </a>
        </nav>

        <div class="mt-auto p-6 bg-white/5 rounded-3xl border border-white/10">
            <p class="text-sm font-semibold truncate" id="user_email">...</p>
            <button onclick="logout()" class="mt-4 text-rose-400 text-sm font-bold flex items-center gap-2">Déconnexion</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-72 p-12">
        <header class="mb-12 flex justify-between items-end">
            <div>
                <h1 class="text-5xl font-black text-slate-900 mb-2">Gestion du Stock</h1>
                <p class="text-slate-500 font-bold" id="product_count">Chargement...</p>
            </div>
            <button onclick="openModal('addModal')" class="bg-emerald-400 text-slate-900 px-6 py-3 rounded-2xl font-bold hover:bg-emerald-300 transition-all">+ Ajouter un produit</button>
        </header>

        <!-- Filters Row -->
        <div class="flex items-center justify-between gap-6 mb-10">
            <div class="flex items-center gap-4 flex-1">
                <div class="relative flex-1">
                    <svg class="absolute left-6 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="searchInput" placeholder="Rechercher par nom ou SKU..." class="w-full bg-white border-none rounded-full py-5 pl-16 pr-8 shadow-sm outline-none font-medium focus:ring-2 focus:ring-emerald-400" oninput="applyFilters()">
                </div>
                <select id="branch_filter" class="bg-white border-none rounded-full px-8 py-5 shadow-sm outline-none font-bold text-slate-500 cursor-pointer" onchange="fetchProducts()">
                    <option value="">Toutes Localisations</option>
                    <option value="1">Alger</option>
                    <option value="2">Oran</option>
                </select>
                <select id="sort_filter" class="bg-white border-none rounded-full px-8 py-5 shadow-sm outline-none font-bold text-slate-500 cursor-pointer" onchange="fetchProducts()">
                    <option value="name">Trier par Nom</option>
                    <option value="date">Date d'ajout</option>
                </select>
                <select id="cat_filter" class="bg-white border-none rounded-full px-8 py-5 shadow-sm outline-none font-bold text-slate-500 cursor-pointer" onchange="applyFilters()">
                    <option value="all">Toutes les catégories</option>
                    <option value="Pharmacie">Pharmacie</option>
                    <option value="Cosmétique">Cosmétique</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>
            <div class="flex bg-white rounded-full p-1.5 shadow-sm" id="stockFilterBtns">
                <button onclick="setStockFilter('all', this)" class="active px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest bg-emerald-400 text-white shadow-lg transition-all">Tous</button>
                <button onclick="setStockFilter('faible', this)" class="px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-slate-50 transition-all">Stock Faible</button>
                <button onclick="setStockFilter('moyen', this)" class="px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-slate-50 transition-all">Stock Moyen</button>
                <button onclick="setStockFilter('fort', this)" class="px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-slate-50 transition-all">Stock Fort</button>
            </div>
        </div>

        <!-- Table Card -->
        <div class="card overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b border-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] bg-slate-50/30">
                        <th class="py-6 px-8 w-12"><input type="checkbox" class="rounded border-slate-300"></th>
                        <th class="py-6 px-8">SKU</th>
                        <th class="py-6 px-8">Nom</th>
                        <th class="py-6 px-8">Catégorie</th>
                        <th class="py-6 px-8">Quantité</th>
                        <th class="py-6 px-8">Statut</th>
                        <th class="py-6 px-8">Prix</th>
                        <th class="py-6 px-8 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory_table" class="divide-y divide-slate-50 font-bold text-slate-700">
                    <tr><td colspan="8" class="py-12 text-center text-slate-400">Initialisation...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modals -->
    <div id="addModal" class="modal hidden fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-[30px] p-8 w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-black mb-6">Ajouter Produit</h2>
            <form id="addForm" onsubmit="submitAddForm(event)" class="space-y-4">
                <input type="text" id="addName" placeholder="Nom du produit" class="w-full bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none focus:ring-2 ring-emerald-400" required>
                <input type="text" id="addSku" placeholder="SKU (ex: PHA-DOL-500)" class="w-full bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none focus:ring-2 ring-emerald-400" required>
                <div class="flex gap-4">
                    <input type="number" id="addQty" placeholder="Quantité" class="w-1/2 bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none" required>
                    <input type="number" id="addPrice" placeholder="Prix unitaire" class="w-1/2 bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none" required>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal('addModal')" class="px-6 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-50">Annuler</button>
                    <button type="submit" class="bg-emerald-400 text-slate-900 px-6 py-3 rounded-xl font-bold hover:bg-emerald-300">Créer</button>
                </div>
            </form>
        </div>
    </div>

    <div id="editModal" class="modal hidden fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-[30px] p-8 w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-black mb-6">Modifier Produit</h2>
            <form id="editForm" onsubmit="submitEditForm(event)" class="space-y-4">
                <input type="hidden" id="editId">
                <input type="text" id="editName" class="w-full bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none focus:ring-2 ring-emerald-400" required>
                <input type="text" id="editSku" class="w-full bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none focus:ring-2 ring-emerald-400" required>
                <div class="flex gap-4">
                    <input type="number" id="editQty" class="w-1/2 bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none" required>
                    <input type="number" id="editPrice" class="w-1/2 bg-slate-50 px-6 py-4 rounded-xl font-bold outline-none" required>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal('editModal')" class="px-6 py-3 rounded-xl font-bold text-slate-400 hover:bg-slate-50">Annuler</button>
                    <button type="submit" class="bg-amber-400 text-slate-900 px-6 py-3 rounded-xl font-bold hover:bg-amber-300">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <div id="detailsModal" class="modal hidden fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-[30px] p-8 w-full max-w-2xl shadow-2xl flex gap-8">
            <div class="flex-1 space-y-6">
                <div>
                    <h2 class="text-2xl font-black text-slate-900" id="detailName">Nom du produit</h2>
                    <p class="text-slate-400 font-bold tracking-widest text-xs uppercase mt-1" id="detailSku">SKU</p>
                </div>
                
                <div class="space-y-4">
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-xs text-slate-400 uppercase tracking-widest font-black mb-1">Fournisseur Actuel</p>
                        <p class="font-bold text-slate-700" id="detailSupplier">Chargement...</p>
                    </div>
                    
                    <div class="bg-slate-50 p-4 rounded-2xl">
                        <p class="text-xs text-slate-400 uppercase tracking-widest font-black mb-3">Historique des Prix (30j)</p>
                        <div class="space-y-2 text-sm font-bold text-slate-600" id="detailPriceHistory">
                            <!-- Historique mocké -->
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="w-48 flex flex-col items-center justify-center space-y-4 border-l border-slate-100 pl-8">
                <p class="text-xs text-slate-400 uppercase tracking-widest font-black text-center">Étiquette QR</p>
                <div id="qrcode" class="p-2 bg-white border-2 border-slate-100 rounded-xl"></div>
                <button onclick="closeModal('detailsModal')" class="w-full mt-4 px-6 py-3 rounded-xl font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">Fermer</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.includes('http') ? window.location.origin : "http://localhost:8000";
        let allProducts = [];
        let currentStockFilter = 'all';

        async function init() {
            const token = localStorage.getItem('omistock_token');
            if (!token) { window.location.href = 'index.html'; return; }
            
            const savedCompany = localStorage.getItem('omistock_company');
            if (savedCompany) {
                document.getElementById('company_name_sidebar').textContent = savedCompany.toUpperCase();
            }

            document.getElementById('user_email').textContent = localStorage.getItem('omistock_user') || 'Utilisateur';
            fetchProducts();
        }

        async function fetchProducts() {
            const token = localStorage.getItem('omistock_token');
            const branchId = document.getElementById('branch_filter').value;
            const sort = document.getElementById('sort_filter').value;
            
            let url = `${API_BASE}/api/inventory?`;
            if (branchId) url += `branch_id=${branchId}&`;
            if (sort === 'date') url += `sort=date&`;

            try {
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
                if(res.ok) {
                    allProducts = await res.json();
                    document.getElementById('product_count').textContent = `${allProducts.length} produits au total`;
                    applyFilters();
                } else {
                    const errorMsg = await res.text();
                    document.getElementById('inventory_table').innerHTML = `<tr><td colspan="8" class="py-12 text-center text-rose-500">Erreur ${res.status}: ${errorMsg || 'Route inaccessible'}</td></tr>`;
                }
            } catch (err) { console.error(err); }
        }

        function getStatusInfo(qty, min) {
            if (qty <= min) return { label: 'Stock Faible', class: 'bg-rose-100 text-rose-600', level: 'faible' };
            if (qty <= min * 2) return { label: 'Stock Moyen', class: 'bg-amber-100 text-amber-600', level: 'moyen' };
            return { label: 'Stock Fort', class: 'bg-teal-100 text-teal-600', level: 'fort' };
        }

        function setStockFilter(filter, btnElement) {
            currentStockFilter = filter;
            const buttons = document.getElementById('stockFilterBtns').children;
            for(let btn of buttons) {
                btn.className = "px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-slate-50 transition-all";
            }
            btnElement.className = "active px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest bg-emerald-400 text-white shadow-lg transition-all";
            applyFilters();
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('cat_filter').value;
            
            let filtered = allProducts.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || (p.sku && p.sku.toLowerCase().includes(search));
                const mockCat = p.sku && p.sku.startsWith('COS') ? 'Cosmétique' : (p.sku && p.sku.startsWith('MAT') ? 'Autre' : 'Pharmacie');
                const matchCat = cat === 'all' || mockCat === cat;
                
                const status = getStatusInfo(p.quantity, p.min_threshold).level;
                const matchStock = currentStockFilter === 'all' || status === currentStockFilter;
                
                return matchSearch && matchCat && matchStock;
            });
            
            renderTable(filtered);
        }

        function renderTable(products) {
            const tbody = document.getElementById('inventory_table');
            tbody.innerHTML = '';
            if(products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="py-12 text-center text-slate-400">Aucun produit trouvé</td></tr>`;
                return;
            }
            products.forEach(p => {
                const mockCat = p.sku && p.sku.startsWith('COS') ? 'Cosmétique' : (p.sku && p.sku.startsWith('MAT') ? 'Autre' : 'Pharmacie');
                const status = getStatusInfo(p.quantity, p.min_threshold);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/50 transition-colors";
                tr.innerHTML = `
                    <td class="py-6 px-8"><input type="checkbox" class="rounded border-slate-300"></td>
                    <td class="py-6 px-8 text-[11px] font-black text-slate-400 tracking-widest uppercase">${p.sku || 'N/A'}</td>
                    <td class="py-6 px-8 text-slate-900 font-black">${p.name}</td>
                    <td class="py-6 px-8 text-slate-400">${mockCat}</td>
                    <td class="py-6 px-8 text-slate-900">${p.quantity}</td>
                    <td class="py-6 px-8"><span class="status-badge ${status.class}">${status.label}</span></td>
                    <td class="py-6 px-8 text-slate-900">${parseFloat(p.price).toLocaleString()} DA</td>
                    <td class="py-6 px-8 text-right space-x-2">
                        <button onclick="openDetailsModal(${p.id})" data-tooltip="Détails & QR" class="p-2.5 text-slate-400 hover:text-emerald-500 hover:bg-emerald-50 rounded-xl transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                        <button onclick="openEditModal(${p.id})" data-tooltip="Modifier" class="p-2.5 text-slate-400 hover:text-amber-500 hover:bg-amber-50 rounded-xl transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                        <button onclick="deleteProduct(${p.id})" data-tooltip="Supprimer" class="p-2.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- Modals & CRUD ---
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function submitAddForm(e) {
            e.preventDefault();
            const token = localStorage.getItem('omistock_token');
            const data = {
                name: document.getElementById('addName').value,
                sku: document.getElementById('addSku').value,
                quantity: parseInt(document.getElementById('addQty').value),
                price: parseFloat(document.getElementById('addPrice').value),
                min_threshold: 5
            };
            try {
                const res = await fetch(`${API_BASE}/api/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                if(res.ok) { closeModal('addModal'); fetchProducts(); document.getElementById('addForm').reset(); }
            } catch(err) { console.error(err); }
        }

        function openDetailsModal(id) {
            const p = allProducts.find(x => x.id === id);
            if(!p) return;
            
            document.getElementById('detailName').innerText = p.name;
            document.getElementById('detailSku').innerText = p.sku || 'N/A';
            document.getElementById('detailSupplier').innerText = p.supplier ? p.supplier.name : 'Grossiste Pharma Local';
            
            // Historique mocké basé sur le prix actuel
            const currentPrice = parseFloat(p.price);
            document.getElementById('detailPriceHistory').innerHTML = `
                <div class="flex justify-between items-center"><span class="text-slate-400">Aujourd'hui</span><span class="text-emerald-500">${currentPrice.toLocaleString()} DA</span></div>
                <div class="flex justify-between items-center"><span class="text-slate-400">Il y a 7j</span><span class="text-slate-600">${(currentPrice * 0.98).toLocaleString()} DA</span></div>
                <div class="flex justify-between items-center"><span class="text-slate-400">Il y a 30j</span><span class="text-slate-600">${(currentPrice * 1.05).toLocaleString()} DA</span></div>
            `;
            
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), {
                text: `${p.sku || 'N/A'} - ${p.name}`,
                width: 128,
                height: 128,
                colorDark : "#0f172a",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
            
            openModal('detailsModal');
        }

        function openEditModal(id) {
            const p = allProducts.find(x => x.id === id);
            if(!p) return;
            document.getElementById('editId').value = p.id;
            document.getElementById('editName').value = p.name;
            document.getElementById('editSku').value = p.sku || '';
            document.getElementById('editQty').value = p.quantity;
            document.getElementById('editPrice').value = p.price;
            openModal('editModal');
        }

        async function submitEditForm(e) {
            e.preventDefault();
            const token = localStorage.getItem('omistock_token');
            const id = document.getElementById('editId').value;
            const data = {
                name: document.getElementById('editName').value,
                sku: document.getElementById('editSku').value,
                quantity: parseInt(document.getElementById('editQty').value),
                price: parseFloat(document.getElementById('editPrice').value)
            };
            try {
                const res = await fetch(`${API_BASE}/api/products/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(data)
                });
                if(res.ok) { closeModal('editModal'); fetchProducts(); }
            } catch(err) { console.error(err); }
        }

        async function deleteProduct(id) {
            if(!confirm("Supprimer ce produit ?")) return;
            const token = localStorage.getItem('omistock_token');
            try {
                const res = await fetch(`${API_BASE}/api/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if(res.ok) { fetchProducts(); }
            } catch(err) { console.error(err); }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        window.onload = init;
    </script>
</body>
</html>
