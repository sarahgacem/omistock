            <h3 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-3">

                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>

            <form id="add_sale_form" onsubmit="submitSale(event)" class="space-y-5">

                    <label class="block text-sm font-semibold text-slate-700 mb-1">Filiale de Vente</label>
                    <select id="sale_branch" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all"></select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Produit</label>
                    <select id="sale_product" required class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all"></select>
                </div>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Quantité</label>
                        <input type="number" id="sale_quantity" required min="1" value="1" class="w-full border border-slate-200 rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition-all">
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 flex gap-3 justify-end">
                    <button type="button" onclick="closeAddSaleModal()" class="px-5 py-2.5 text-slate-500 hover:text-slate-700 hover:bg-slate-100 font-semibold rounded-xl transition-colors">Annuler</button>
                    <button type="submit" id="submit_sale_btn" class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-md transition-colors flex items-center gap-2">
                        Valider la vente
                    </button>
                </div>
            </form>
        </div>

    <script>
        const API_BASE = window.location.origin;
        let modalProducts = [];

        async function init() {
            console.log("init() called");
            const token = localStorage.getItem('omistock_token');
            if (!token) { window.location.href = 'index.html'; return; }
            
            const userEmail = localStorage.getItem('omistock_user') || 'Utilisateur';
            document.getElementById('user_email').textContent = userEmail;
            
            // Enrich details via profile call
            try {
                const meRes = await fetch(`${API_BASE}/api/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (meRes.ok) {
                    const currentUser = await meRes.json();
                    document.getElementById('user_email').textContent = currentUser.email;
                    document.getElementById('user_role_badge').textContent = currentUser.user_type || 'ADMIN';
                    document.getElementById('user_branch_sidebar').textContent = currentUser.branch_name || 'Admin Central';
                    
                    if (currentUser.user_type === 'ADMIN') {
                        document.getElementById('admin_maintenance').classList.remove('hidden');
                    }
                    
                    // Différenciation dynamique par entreprise (Multi-Tenant)
                    const isFood = currentUser.email.includes("food");
                    const companyName = isFood ? "AGRO-INDUSTRIE DZ" : "OMISTOCK BUSINESS SOLUTIONS";
                    document.getElementById('company_name_sidebar').textContent = companyName.toUpperCase();
                }
            } catch (e) {
                console.error("Erreur de profil:", e);
            }

            console.log("Starting to load sales...");
            try {
                // We'll also need branches to resolve branch_id
                const branchesRes = await fetch(`${API_BASE}/api/branches`, { headers: { 'Authorization': `Bearer ${token}` } });
                
                if (!branchesRes.ok) {
                    console.error("Erreur chargement branches:", branchesRes.status);
                    // Continue with empty branch map if branches fail
                }
                
                const branches = branchesRes.ok ? await branchesRes.json() : [];
                const branchMap = {};
                branches.forEach(b => branchMap[b.id] = b.name);

                const response = await fetch(`${API_BASE}/api/sales`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) { logout(); return; }
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const sales = await response.json();
                const salesCount = Array.isArray(sales) ? sales.length : 0;
                document.getElementById('total_sales').textContent = `${salesCount} ventes enregistrées`;
                renderTable(sales, branchMap);
                console.log("Sales loaded successfully:", salesCount);
            } catch (error) {
                console.error("Erreur de chargement:", error);
                document.getElementById('total_sales').textContent = "Erreur de chargement des ventes";
            }
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' };
            return new Date(dateString).toLocaleDateString('fr-FR', options);
        }

        function renderTable(sales, branchMap) {
            const tbody = document.getElementById('sales_table');
            tbody.innerHTML = '';
            
            if (sales.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-20 text-center">
                            <div class="flex flex-col items-center justify-center max-w-md mx-auto">
                                <div class="w-20 h-20 bg-slate-50 border border-slate-100 rounded-3xl flex items-center justify-center mb-6 text-slate-400 shadow-inner">
                                    <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                                    </svg>
                                </div>
                                <h3 class="text-slate-950 font-black text-lg mb-2">Aucune vente enregistrée</h3>
                                <p class="text-slate-400 text-sm leading-relaxed">Les ventes et sorties de stock s'afficheront ici en temps réel dès qu'un agent effectuera des sorties sur l'application mobile ou qu'une vente sera enregistrée.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            sales.forEach(s => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-4 px-6 text-sm font-semibold text-slate-800">#TR-${s.id.toString().padStart(4, '0')}</td>
                    <td class="py-4 px-6 text-sm text-slate-500">${formatDate(s.date)}</td>
                    <td class="py-4 px-6 text-sm font-medium text-slate-700">${s.customer_id ? 'Client #' + s.customer_id : 'Client Comptant'}</td>
                    <td class="py-4 px-6 text-sm text-slate-600">${branchMap[s.branch_id] || 'N/A'}</td>
                    <td class="py-4 px-6 text-sm font-bold text-teal-600">${s.total_amount} DA</td>
                    <td class="py-4 px-6 text-right space-x-2">
                        <button onclick="openInvoice(${s.id})" class="text-slate-400 hover:text-indigo-500" title="Imprimer Facture">
                            <svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function adminAction(actionType) {
            const token = localStorage.getItem('omistock_token');
            if (!token) return;

            const confirmMsg = actionType === 'seed' 
                ? "Initialiser la base de données avec les données de démonstration ?" 
                : "ATTENTION : Nettoyer toutes les données ? (Historique, ventes, mouvements)";
            if (!confirm(confirmMsg)) return;

            if (actionType === 'clean') {
                alert("Sauvegarde préventive automatique avant nettoyage...");
                await backupDatabase();
            }

            try {
                const response = await fetch(`/api/admin/${actionType}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const resData = await response.json();
                alert(resData.message || "Opération réussie !");
                window.location.reload();
            } catch (e) {
                alert("Erreur lors de l'opération");
            }
        }

        async function backupDatabase(btnElement) {
            const token = localStorage.getItem('omistock_token');
            if (!token) return;
            const btn = btnElement || document.querySelector("button[onclick*='backupDatabase']");
            let originalHTML = "Sauvegarder la Base";
            if (btn) {
                originalHTML = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = "...";
            }

            try {
                const response = await fetch('/api/admin/backup', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!response.ok) throw new Error("Backup failed");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `omistock_backup.db`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                if (btn) {
                    btn.classList.add('bg-emerald-600');
                    btn.innerHTML = "Sauvegarde OK !";
                    setTimeout(() => {
                        btn.classList.remove('bg-emerald-600');
                        btn.innerHTML = originalHTML;
                        btn.disabled = false;
                    }, 2000);
                }
            } catch (e) {
                alert("Erreur lors de la sauvegarde");
                if (btn) {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }
            }
        }

        async function openAddSaleModal() {
            document.getElementById('add_sale_modal').classList.remove('hidden');
            
            const token = localStorage.getItem('omistock_token');
            try {
                const branchRes = await fetch(`${API_BASE}/api/branches`, { headers: { 'Authorization': `Bearer ${token}` } });
                const branches = await branchRes.json();
                const branchSelect = document.getElementById('sale_branch');
                branchSelect.innerHTML = branches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');

                const prodRes = await fetch(`${API_BASE}/api/inventory`, { headers: { 'Authorization': `Bearer ${token}` } });
                modalProducts = await prodRes.json();
                const productSelect = document.getElementById('sale_product');
                productSelect.innerHTML = modalProducts.map(p => `<option value="${p.id}">${p.name} - ${p.price} DA (Stock Global: ${p.quantity})</option>`).join('');
            } catch (error) {
                console.error("Erreur de chargement pour la modale", error);
            }
        }

        function closeAddSaleModal() {
            document.getElementById('add_sale_modal').classList.add('hidden');
            document.getElementById('add_sale_form').reset();
        }

        async function submitSale(e) {
            e.preventDefault();
            const btn = document.getElementById('submit_sale_btn');
            btn.innerHTML = 'Création...';
            btn.disabled = true;

            const branchId = parseInt(document.getElementById('sale_branch').value);
            const productId = parseInt(document.getElementById('sale_product').value);
            const quantity = parseInt(document.getElementById('sale_quantity').value);

            const product = modalProducts.find(p => p.id === productId);
            const price = product ? product.price : 0;

            const payload = {
                branch_id: branchId,
                customer_id: null,
                items: [
                    {
                        product_id: productId,
                        quantity: quantity,
                        unit_price: price
                    }
                ]
            };

            const token = localStorage.getItem('omistock_token');
            try {
                const response = await fetch(`${API_BASE}/api/sales`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Erreur de création de vente");
                }

                closeAddSaleModal();
                init(); // refresh table
            } catch (error) {
                alert(error.message);
            } finally {
                btn.innerHTML = 'Valider la vente';
                btn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('omistock_token');
            localStorage.removeItem('omistock_user');
            window.location.href = 'index.html';
        }

        async function openInvoice(saleId) {
            const token = localStorage.getItem('omistock_token');
            try {
                const response = await fetch(`${API_BASE}/api/sales/${saleId}/invoice/html`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    alert("Session expirée. Veuillez vous reconnecter.");
                    logout();
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }
                
                const html = await response.text();
                
                // Open new window and inject HTML
                const newWindow = window.open('', '_blank');
                newWindow.document.write(html);
                newWindow.document.close();
                
                // Trigger print after a short delay
                setTimeout(() => {
                    newWindow.print();
                }, 500);
            } catch (error) {
                console.error("Erreur de chargement de la facture:", error);
                alert("Erreur de chargement de la facture");
            }
        }

        window.onload = init;
    
    </script>
    <script src="erp-sidebar.js"></script>
</body>
</html>
