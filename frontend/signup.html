<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMISTOCK - Création de compte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-200 via-slate-100 to-emerald-50">

    <div class="max-w-md w-full glass p-10 rounded-[40px] shadow-2xl">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg rotate-3">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
            <h1 class="text-3xl font-black text-slate-900 mb-2">Rejoindre OMISTOCK</h1>
            <p class="text-slate-500 font-medium">Créez votre compte entreprise en 1 minute.</p>
        </div>

        <form id="signup-form" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Nom de l'Entreprise</label>
                <input type="text" id="company_name" required placeholder="Ex: Ma Société SAS" class="w-full px-5 py-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Email Professionnel</label>
                <input type="email" id="email" required placeholder="admin@exemple.com" class="w-full px-5 py-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full px-5 py-4 rounded-2xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50">
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transform active:scale-95 transition-all shadow-xl shadow-slate-200">
                Créer mon compte
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-slate-500 text-sm font-medium">Déjà inscrit ? <a href="index.html" class="text-emerald-600 font-bold hover:underline">Connectez-vous</a></p>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";
        const form = document.getElementById('signup-form');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const company_name = document.getElementById('company_name').value;

            try {
                const res = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, company_name })
                });

                const data = await res.json();
                if (res.ok) {
                    alert("Compte créé avec succès ! Vous pouvez maintenant vous connecter.");
                    window.location.href = 'index.html';
                } else {
                    alert(data.detail || "Erreur lors de l'inscription");
                }
            } catch (err) {
                alert("Erreur de connexion au serveur");
            }
        };
    </script>
</body>
</html>
