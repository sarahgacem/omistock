<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMISTOCK - Création de compte entreprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-200 via-slate-100 to-emerald-50">

    <div class="max-w-2xl w-full glass p-10 rounded-[40px] shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg rotate-3">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
            <h1 class="text-3xl font-black text-slate-900 mb-2">Rejoindre OMISTOCK</h1>
            <p class="text-slate-500 font-medium">Créez votre compte entreprise en moins d'une minute.</p>
        </div>

        <form id="signup-form" class="space-y-6">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">1. Identifiants de Connexion</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Email Professionnel</label>
                    <input type="email" id="email" required placeholder="admin@exemple.com" class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Mot de passe</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
            </div>

            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 pt-2">2. Informations Commerciales de l'Entreprise</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Nom de l'Entreprise</label>
                    <input type="text" id="company_name" required placeholder="Ex: Ma Société SAS" class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">N° de Registre du Commerce (RC)</label>
                    <input type="text" id="rc" placeholder="Ex: 16/00-0123456B20" class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">N° d'Identification Fiscale (NIF)</label>
                    <input type="text" id="nif" placeholder="Ex: 000416000987654" class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Secteur d'Activité</label>
                    <input type="text" id="activity_sector" placeholder="Ex: Pharma, Distribution, etc." class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Téléphone Professionnel</label>
                    <input type="text" id="phone" placeholder="Ex: +213 21 00 00 00" class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1 ml-1">Adresse Commerciale</label>
                    <input type="text" id="address" placeholder="Ex: 12 Rue Didouche Mourad, Alger" class="w-full px-4 py-3 rounded-xl border-none ring-1 ring-slate-200 focus:ring-2 focus:ring-emerald-400 outline-none transition-all bg-white/50 text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transform active:scale-95 transition-all shadow-xl shadow-slate-200 mt-4 text-sm">
                Créer mon compte entreprise
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-slate-500 text-sm font-medium">Déjà inscrit ? <a href="index.html" class="text-emerald-600 font-bold hover:underline">Connectez-vous</a></p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const form = document.getElementById('signup-form');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const company_name = document.getElementById('company_name').value;
            const commercial_register_number = document.getElementById('rc').value;
            const nif = document.getElementById('nif').value;
            const activity_sector = document.getElementById('activity_sector').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;

            try {
                const res = await fetch(`${API_BASE}/register/enterprise`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': '1'
                    },
                    body: JSON.stringify({ 
                        email, 
                        password, 
                        company_name,
                        commercial_register_number,
                        nif,
                        activity_sector,
                        phone,
                        address
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    alert("Compte entreprise créé avec succès ! Vous pouvez maintenant vous connecter.");
                    window.location.href = 'index.html';
                } else {
                    alert(data.detail || "Erreur lors de l'inscription");
                }
            } catch (err) {
                alert("Erreur de connexion au serveur");
            }
        };
    </script>
</body>
</html>
