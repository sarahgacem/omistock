<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/app/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OMISTOCK">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMISTOCK - Historique des Transactions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .sidebar { background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); }
        .card { background: white; border-radius: 30px; border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.04); }
        .nav-item { color: #94a3b8; transition: all 0.3s; }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.05); }
        .nav-item.active { background: #2dd4bf; color: white; box-shadow: 0 10px 20px -5px rgba(45, 212, 191, 0.4); }
    </style>
</head>
<body class="flex min-h-screen">
<!-- Hamburger button (mobile only) -->
    <button id="menuBtn" class="fixed top-4 left-4 z-[100] lg:hidden bg-slate-800 text-white p-2 rounded-xl shadow-lg">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside class="sidebar w-72 flex flex-col p-8 text-white fixed h-full z-50 overflow-y-auto transition-transform duration-300 -translate-x-full lg:translate-x-0">
        <div class="mb-12 flex items-center gap-3">
            <div class="w-10 h-10 bg-emerald-400 rounded-xl flex items-center justify-center">
                <svg class="w-6 h-6 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
            <h2 class="text-xl font-bold tracking-tight">OMISTOCK</h2>
        </div>

        <nav class="space-y-3 flex-1">
            <a href="dashboard.html" class="nav-item flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                <span class="font-medium">Dashboard</span>
            </a>
            <a href="reports.html" class="nav-item flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="font-medium">Rapports</span>
            </a>
            <a href="logs.html" class="nav-item active flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span class="font-medium">Activity Logs</span>
            </a>
            <a href="#" class="nav-item flex items-center gap-4 p-4 rounded-2xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="font-medium">Paramètres</span>
            </a>
        </nav>

        <div class="mt-auto p-6 bg-white/5 rounded-3xl border border-white/10">
            <p class="text-xs text-slate-400 mb-2 uppercase tracking-widest font-bold">Session</p>
            <p class="text-sm font-semibold truncate" id="user_email">...</p>
            <button onclick="logout()" class="mt-4 text-rose-400 text-sm font-bold flex items-center gap-2 hover:text-rose-300 transition-colors">
                <span>Déconnexion</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 ml-72 p-12">
        <header class="mb-12">
            <h1 class="text-5xl font-black text-slate-900 mb-3">Historique des Transactions</h1>
            <p class="text-slate-500 font-medium text-lg">Journal complet des mouvements de stock et flux logistiques.</p>
        </header>

        <div class="card p-8">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100">
                            <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-widest">Date</th>
                            <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-widest">Produit ID</th>
                            <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-widest">Quantité</th>
                            <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-widest">Type</th>
                            <th class="py-4 px-6 text-xs font-bold text-slate-400 uppercase tracking-widest">Raison</th>
                        </tr>
                    </thead>
                    <tbody id="logs_table" class="divide-y divide-slate-50">
                        <tr>
                            <td colspan="3" class="py-8 text-center text-slate-500">Chargement des logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        async function getAuthToken() {
            const token = localStorage.getItem('omistock_token');
            if (!token) {
                window.location.href = 'index.html';
                return null;
            }
            return token;
        }

        function logout() {
            localStorage.removeItem('omistock_token');
            localStorage.removeItem('omistock_user');
            window.location.href = 'index.html';
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit', second:'2-digit' };
            return new Date(dateString).toLocaleDateString('fr-FR', options);
        }

        function getMovementBadge(type) {
            if (type === "IN") return `<span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold">ENTRÉE</span>`;
            if (type === "OUT") return `<span class="bg-rose-100 text-rose-700 px-3 py-1 rounded-full text-xs font-bold">SORTIE</span>`;
            return `<span class="bg-slate-100 text-slate-700 px-3 py-1 rounded-full text-xs font-bold">${type}</span>`;
        }

        async function loadLogs() {
            document.getElementById('user_email').textContent = localStorage.getItem('omistock_user') || 'Non connecté';
            const token = await getAuthToken();
            if (!token) return;

            const API_BASE = "http://" + (window.location.hostname || "localhost") + ":8000";
            try {
                const response = await fetch(`${API_BASE}/api/movements`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    logout();
                    return;
                }

                const movements = await response.json();
                const tbody = document.getElementById('logs_table');
                tbody.innerHTML = '';

                if (movements.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500 font-medium">Aucun mouvement trouvé.</td></tr>`;
                    return;
                }

                movements.forEach(m => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition-colors group";
                    tr.innerHTML = `
                        <td class="py-4 px-6 text-sm text-slate-500 whitespace-nowrap">${formatDate(m.created_at)}</td>
                        <td class="py-4 px-6 text-sm font-bold text-slate-700">Produit #${m.product_id}</td>
                        <td class="py-4 px-6 text-sm font-black ${m.quantity > 0 ? 'text-emerald-600' : 'text-rose-600'}">${m.quantity > 0 ? '+' : ''}${m.quantity}</td>
                        <td class="py-4 px-6">${getMovementBadge(m.movement_type)}</td>
                        <td class="py-4 px-6 text-sm font-medium text-slate-600">${m.reason}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Erreur de chargement:", error);
                document.getElementById('logs_table').innerHTML = `<tr><td colspan="3" class="py-8 text-center text-rose-500 font-bold">Erreur de connexion au serveur</td></tr>`;
            }
        }

        window.onload = loadLogs;
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/app/service-worker.js')
            .then(reg => console.log('SW enregistré:', reg.scope))
            .catch(err => console.log('SW erreur:', err));
        });
      }
    </script>
    <script>
      const menuBtn = document.getElementById('menuBtn');
      const sidebar = document.querySelector('aside.sidebar');
      const overlay = document.getElementById('overlay');
      function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      }
      function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
      menuBtn.addEventListener('click', openSidebar);
      overlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
