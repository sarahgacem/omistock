    <script>
        async function init() {
            const token = localStorage.getItem('omistock_token');
            if (!token) { window.location.href = 'index.html'; return; }
            
            const userEmail = localStorage.getItem('omistock_user') || 'Utilisateur';
            document.getElementById('user_email').textContent = userEmail;
            
            // Enrich details via profile call
            const API_BASE = window.location.origin;
            try {
                const meRes = await fetch(`${API_BASE}/api/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (meRes.ok) {
                    const currentUser = await meRes.json();
                    document.getElementById('user_email').textContent = currentUser.email;
                    document.getElementById('user_role_badge').textContent = currentUser.user_type || 'ADMIN';
                    document.getElementById('user_branch_sidebar').textContent = currentUser.branch_name || 'Admin Central';
                    
                    if (currentUser.user_type === 'ADMIN') {
                        document.getElementById('admin_maintenance').classList.remove('hidden');
                    }
                    
                    // Différenciation dynamique par entreprise (Multi-Tenant)
                    const isFood = currentUser.email.includes("food");
                    const companyName = isFood ? "AGRO-INDUSTRIE DZ" : "OMISTOCK BUSINESS SOLUTIONS";
                    document.getElementById('company_name_sidebar').textContent = companyName.toUpperCase();
                }
            } catch (e) {
                console.error("Erreur de profil:", e);
            }
            try {
                const response = await fetch(`${API_BASE}/api/suppliers`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) { logout(); return; }
                
                const suppliers = await response.json();
                document.getElementById('total_suppliers').textContent = `${suppliers.length} fournisseurs partenaires`;
                renderGrid(suppliers);
            } catch (error) {
                console.error("Erreur de chargement:", error);
            }
        }

        function renderGrid(suppliers) {
            const grid = document.getElementById('suppliers_grid');
            grid.innerHTML = '';
            
            if (suppliers.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 font-medium card">Aucun fournisseur enregistré.</div>`;
                return;
            }

            suppliers.forEach(s => {
                const initals = s.name.substring(0, 2).toUpperCase();
                const card = document.createElement('div');
                card.className = "card p-6 flex flex-col";
                card.innerHTML = `
                    <div class="flex items-start gap-4 mb-4">
                        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-lg font-bold text-teal-600">
                            ${initals}
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${s.name}</h3>
                            <p class="text-sm text-slate-500 flex items-center gap-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                ${s.address || 'Adresse non renseignée'}
                            </p>
                        </div>
                    </div>
                    <div class="space-y-2 mt-auto">
                        <div class="flex items-center gap-2 text-sm text-slate-600">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            ${s.contact_name || 'Contact inconnu'}
                        </div>
                        <div class="flex items-center gap-2 text-sm text-slate-600">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            ${s.email || 'Email non renseigné'}
                        </div>
                        <div class="flex items-center gap-2 text-sm text-slate-600">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            ${s.phone || 'Téléphone non renseigné'}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function adminAction(actionType) {
            const token = localStorage.getItem('omistock_token');
            if (!token) return;

            const confirmMsg = actionType === 'seed' 
                ? "Initialiser la base de données avec les données de démonstration ?" 
                : "ATTENTION : Nettoyer toutes les données ? (Historique, ventes, mouvements)";
            if (!confirm(confirmMsg)) return;

            if (actionType === 'clean') {
                alert("Sauvegarde préventive automatique avant nettoyage...");
                await backupDatabase();
            }

            try {
                const response = await fetch(`/api/admin/${actionType}`, {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const resData = await response.json();
                alert(resData.message || "Opération réussie !");
                window.location.reload();
            } catch (e) {
                alert("Erreur lors de l'opération");
            }
        }

        async function backupDatabase(btnElement) {
            const token = localStorage.getItem('omistock_token');
            if (!token) return;
            const btn = btnElement || document.querySelector("button[onclick*='backupDatabase']");
            let originalHTML = "Sauvegarder la Base";
            if (btn) {
                originalHTML = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = "...";
            }

            try {
                const response = await fetch('/api/admin/backup', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!response.ok) throw new Error("Backup failed");

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `omistock_backup.db`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                if (btn) {
                    btn.classList.add('bg-emerald-600');
                    btn.innerHTML = "Sauvegarde OK !";
                    setTimeout(() => {
                        btn.classList.remove('bg-emerald-600');
                        btn.innerHTML = originalHTML;
                        btn.disabled = false;
                    }, 2000);
                }
            } catch (e) {
                alert("Erreur lors de la sauvegarde");
                if (btn) {
                    btn.innerHTML = originalHTML;
                    btn.disabled = false;
                }
            }
        }

        window.onload = init;

        async function openRestockModal() {
            document.getElementById('restock_modal').classList.remove('hidden');
            
            const token = localStorage.getItem('omistock_token');
            const API_BASE = window.location.origin;
            
            try {
                // Load suppliers
                const supplierRes = await fetch(`${API_BASE}/api/suppliers`, { headers: { 'Authorization': `Bearer ${token}` } });
                const suppliers = await supplierRes.json();
                const supplierSelect = document.getElementById('restock_supplier');
                supplierSelect.innerHTML = '<option value="">Sélectionner un fournisseur</option>' + 
                    suppliers.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

                // Load products
                const productRes = await fetch(`${API_BASE}/api/inventory`, { headers: { 'Authorization': `Bearer ${token}` } });
                const products = await productRes.json();
                const productSelect = document.getElementById('restock_product');
                productSelect.innerHTML = '<option value="">Sélectionner un produit</option>' + 
                    products.map(p => `<option value="${p.id}">${p.name} (Stock: ${p.quantity})</option>`).join('');

                // Load branches
                const branchRes = await fetch(`${API_BASE}/api/branches`, { headers: { 'Authorization': `Bearer ${token}` } });
                const branches = await branchRes.json();
                const branchSelect = document.getElementById('restock_branch');
                branchSelect.innerHTML = '<option value="">Sélectionner une filiale</option>' + 
                    branches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            } catch (error) {
                console.error("Erreur de chargement pour la modale", error);
                alert("Erreur de chargement des données");
            }
        }

        function closeRestockModal() {
            document.getElementById('restock_modal').classList.add('hidden');
            document.getElementById('restock_form').reset();
        }

        async function submitRestock(e) {
            e.preventDefault();
            const btn = document.getElementById('submit_restock_btn');
            btn.innerHTML = 'Traitement...';
            btn.disabled = true;

            const supplierId = parseInt(document.getElementById('restock_supplier').value);
            const productId = parseInt(document.getElementById('restock_product').value);
            const branchId = parseInt(document.getElementById('restock_branch').value);
            const quantity = parseInt(document.getElementById('restock_quantity').value);
            const purchasePrice = parseFloat(document.getElementById('restock_price').value) || 0;

            const token = localStorage.getItem('omistock_token');
            const API_BASE = window.location.origin;

            const payload = {
                supplier_id: supplierId,
                product_id: productId,
                branch_id: branchId,
                quantity: quantity,
                purchase_price: purchasePrice
            };

            try {
                const response = await fetch(`${API_BASE}/api/restock`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || "Erreur de réapprovisionnement");
                }

                const result = await response.json();
                alert("Réapprovisionnement effectué avec succès !");
                closeRestockModal();
                
                // Offer to download purchase order
                if (result.movement_id) {
                    if (confirm("Voulez-vous télécharger le bon de commande ?")) {
                        window.open(`${API_BASE}/api/restock/${result.movement_id}/order/html`, '_blank');
                    }
                }
            } catch (error) {
                alert(error.message);
            } finally {
                btn.innerHTML = 'Valider';
                btn.disabled = false;
            }
        }
    
    </script>
    <script src="erp-sidebar.js"></script>
</body>
</html>
